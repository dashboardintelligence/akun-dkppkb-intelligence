# Menerbitkan tampilan statis (folder web/) ke GitHub Pages.
# Prasyarat satu kali: Settings > Pages > Build and deployment > Source = "GitHub Actions".
# URL Apps Script diambil dari Settings > Secrets and variables > Actions > Variables > API_URL
# (atau isi langsung web/config.js).
name: Terbitkan ke GitHub Pages
on:
  push:
    branches: [main]
    paths: ['src/Index.html', 'src/Stylesheet.html', 'src/Latar.html', 'src/JavaScript.html', 'web/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Rakit situs statis
        env:
          API_URL: ${{ vars.API_URL }}
        run: node web/build.js
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
